services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant@sha256:23f4dfbb69ce76315dbc4de7915504f1c2dcecd7ca2648113a493a385972e133
    container_name: alice-commander-ha
    user: "1000:1000"
    entrypoint: ["python3", "-m", "homeassistant"]
    command: ["--config", "/config"]
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - ./config:/config
      - ../../data/voice:/commander-voice:ro
    environment:
      TZ: Europe/Samara
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,mode=1777
      - /run:rw,nosuid,nodev,size=16m,mode=1777
    mem_limit: 1536m
    cpus: 2
    pids_limit: 256
    restart: unless-stopped
    stop_grace_period: 60s
